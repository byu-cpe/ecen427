# Hand-maintained overlay of website links, merged into _data/schedule.yml by
#   .claude/skills/learning-suite/scripts/pull_schedule.py
#
# Learning Suite owns the dates, lecture titles, quizzes and due dates. This file
# owns the links and website-only notes, because Learning Suite has no place to
# record them. Keys are dates. `slides` keys are matched against the Learning
# Suite item title (a case-insensitive substring is enough). `note` renders as a
# small grey line at the top of the day, `holiday` relabels a day off, `rename`
# shortens a Learning Suite item title for the public calendar, `add_lectures`
# lists website-only lecture lines (each is dropped automatically once an item
# with the same title exists in Learning Suite), and `order` pins the display
# order of that day's lecture titles.

"2026-09-02":

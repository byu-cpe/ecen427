<!-- Bootstrap core JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

<script>
    // Sidebar toggle
    document.getElementById("menu-toggle").addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("wrapper").classList.toggle("toggled");
    });

    // Show the page title in the navbar once the on-page title scrolls out of view
    var pageTitle = document.getElementById("page-title");
    var titleBar = document.getElementById("page-title-bar");
    if (pageTitle && titleBar && "IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
            titleBar.textContent = entries[0].isIntersecting ? "" : pageTitle.textContent.trim();
        }).observe(pageTitle);
    }
</script>
